services:
  - type: web
    name: yo-soy-abundancia
    env: node
    plan: free
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_APP_URL
        value: https://yo-soy-abundancia.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: yo-soy-abundancia-db
          property: connectionString

databases:
  - name: yo-soy-abundancia-db
    plan: free
